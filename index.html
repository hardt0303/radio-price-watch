<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10212c"><title>Icom ID-5200A Price Watch</title><style>
:root{color-scheme:dark;--bg:#10212c;--panel:#192f3d;--line:#36505e;--muted:#b3c5cc;--mint:#a3f3d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5ee;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px 18px 50px}nav{border-bottom:1px solid var(--line);padding:10px 0 17px;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:end;gap:14px}h1{font-size:clamp(34px,6vw,62px);letter-spacing:-.05em;margin:24px 0 4px}h2{font-size:20px}.muted{color:var(--muted)}.stats,.cols{display:grid;gap:14px;margin:20px 0}.stats{grid-template-columns:2fr 1fr}.cols{grid-template-columns:1.5fr 1fr;align-items:start}.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:17px}.best{border-top:3px solid var(--mint)}.big{display:block;font:600 clamp(32px,5vw,52px) ui-monospace,monospace;margin:8px 0}.good{color:var(--mint)}.entry{border-top:1px solid var(--line);padding:13px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:inherit;text-underline-offset:3px}.price{font:650 20px ui-monospace,monospace;white-space:nowrap}small,time{display:block;color:var(--muted);margin-top:5px}.drop{color:var(--mint)}button{border:0;border-radius:8px;padding:12px 16px;background:var(--mint);font-weight:700;font-size:15px}@media(max-width:650px){.cols{grid-template-columns:1fr}}@media(max-width:420px){.stats{grid-template-columns:1.3fr 1fr}.box{padding:12px}}
</style></head><body><main><nav>Radio Price Watch <span class="muted">· hourly updates</span></nav><div class="hero"><div><h1>Icom ID-5200A</h1><p class="muted">Price comparison across six retailers</p></div><button id="refresh">Refresh</button></div><p id="status" class="muted">Loading price data…</p><div class="stats"><section class="box best"><span class="muted">Lowest verified price</span><strong id="best" class="big good">—</strong><span id="leader"></span></section><section class="box"><span class="muted">Stores with prices</span><strong id="coverage" class="big">—</strong></section></div><div class="cols"><section class="box"><h2>Store prices</h2><div id="stores"></div></section><section class="box"><h2>Recent drops</h2><div id="drops"></div></section></div></main><script>
const stores=[["R&L Electronics","https://www.randl.com/index.php?main_page=product_info&cPath=14_300&products_id=76616"],["Ham Radio Outlet","https://www.hamradio.com/detail.cfm?pid=71-005028"],["DX Engineering","https://www.dxengineering.com/part/icom/id-5200a/8910884"],["Associated Radio","https://associatedradio.com/nitem.php?cat_id=78&item_id=2108&manuf=Icom"],["MTC Radio","https://mtcradio.com/products/icom-id-5200a-50w-144-430mhz-dual-band-transceiver"],["GigaParts","https://www.gigaparts.com/icom-id-5200-50w-144-430mhz-dual-band-transceiver.html"]];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100),el=id=>document.getElementById(id);
function add(p,t,s,c=''){let x=document.createElement(t);x.textContent=s;x.className=c;p.append(x);return x}
async function load(){try{let r=await fetch('./prices.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json(),arr=stores.map(([name,url])=>({...d.stores?.[name],name,url}));let valid=arr.filter(x=>Number.isInteger(x.price));valid.sort((a,b)=>a.price-b.price);el('best').textContent=valid.length?money(valid[0].price):'—';el('leader').textContent=valid[0]?.name||'Awaiting verified readings';el('coverage').textContent=valid.length+' / 6';el('status').textContent=d.updated_at?'Updated '+new Date(d.updated_at).toLocaleString():'Waiting for the first hourly check';el('stores').replaceChildren();for(let s of arr){let e=add(el('stores'),'div','','entry'),row=add(e,'div','','row'),a=add(row,'a',s.name);a.href=s.url;a.target='_blank';a.rel='noopener';add(row,'strong',s.price?money(s.price):'—','price');add(e,'small',s.status||'Awaiting first reading');if(s.previous&&s.price<s.previous)add(e,'small','↓ '+money(s.previous-s.price)+' from '+money(s.previous),'drop')}el('drops').replaceChildren();let drops=d.drops||[];for(let x of drops.slice(0,12)){let e=add(el('drops'),'div','','entry');add(e,'b',x.store);add(e,'p','↓ '+money(x.previous-x.price)+' · '+money(x.previous)+' → '+money(x.price),'drop');add(e,'time',new Date(x.at).toLocaleString())}if(!drops.length)add(el('drops'),'p','Price drops will appear here when detected.','muted')}catch{el('status').textContent='Price data is not available yet. The hourly update will publish it when the first check succeeds.'}}
el('refresh').onclick=load;load();setInterval(load,60000);
</script></body></html>
